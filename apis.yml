name: iconik
kind: company
description: >-
  iconik is a hybrid cloud media asset management (MAM) platform for video and
  media teams, letting organizations ingest, organize, search, collaborate on,
  and distribute media across cloud and on-premise storage without vendor
  lock-in. iconik is API-first: nearly everything in the product is exposed
  through a set of versioned REST microservice APIs - Assets, Collections,
  Metadata, Search, Files, and Jobs - so integrators can automate ingest,
  enrich metadata, drive search and discovery, manage files and formats across
  connected storages, and orchestrate asynchronous work. The API is
  authenticated with an application ID and an auth token generated by an
  administrator in the web UI, and event notifications are delivered as HTTP
  webhooks.
