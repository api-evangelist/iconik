meters:
- name: active_users
  description: Users who log in during the month, billed by role (collaborator, browse, standard, power).
  unit: users
  aggregation: max
  dimensions:
  - account
  - role
- name: storage
  description: Managed storage consumed for proxies, transfers, and other media, drawn from credits.
  unit: bytes
  aggregation: sum
  dimensions:
  - account
  - storage
- name: egress
  description: Data egress / transfer out, drawn from credits.
  unit: bytes
  aggregation: sum
  dimensions:
  - account
- name: ai_credits
  description: AI and machine-learning processing (e.g. transcription, face recognition), drawn from credits.
  unit: credits
  aggregation: sum
  dimensions:
  - account
- name: services
  description: Transcode, automation runs, and other services consumed as credits.
  unit: credits
  aggregation: sum
  dimensions:
  - account
principles:
- name: Visibility
  description: Track active users by role plus consumable credit draw-down (storage, egress, AI, services); also monitor storage and egress cost on the connected cloud accounts iconik uses.
- name: Allocation
  description: Map users and collections to teams or productions so both iconik charges and underlying storage cost tie back to cost centers.
- name: Optimization
  description: Right-size user roles to actual need, prune unused assets and proxies, use bring-your-own storage tiers, and scale down during quiet periods since you pay only for users who log in.
- name: Accountability
  description: Assign owners per workspace/collection and review monthly active-user counts and credit consumption against plan allowances or the fixed annual cost option.
