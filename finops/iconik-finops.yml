description: >-
  FinOps view of iconik spend. iconik is billed on a usage basis: a per-user
  monthly charge for the users who actually log in (by role - collaborator,
  browse, standard, power) plus consumables drawn down from credits as they are
  used, covering storage, egress, AI, and services. Because iconik connects to
  your own AWS, Azure, Google Cloud, or on-premise storage rather than forcing a
  proprietary storage migration, a meaningful share of media storage and egress
  cost can sit on your own cloud bill in addition to iconik's invoice - so cost
  visibility spans both iconik and your underlying storage provider. Enterprise
  agreements offer a fixed annual cost option for budget certainty.
notes: >-
  Per-unit consumable rates and Professional/Enterprise pricing are not publicly
  disclosed; verify on the iconik pricing page during reconciliation. Track both
  the iconik invoice (users + credits) and the storage/egress charges on your
  connected cloud accounts.
