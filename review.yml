actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists. iconik's public API is entirely
    request/response REST over HTTPS, and its event mechanism is HTTP webhooks
    (server-to-endpoint POST callbacks). No AsyncAPI document was created because
    there is no server-push, bidirectional, or streaming transport on iconik's
    own API to model.
