aid: iconik
name: iconik
review:
  question: Does iconik expose a documented public WebSocket API?
  answer: false
  date: '2026-07-05'
  reviewer: API Evangelist
  asyncapiSpecCreated: false
  asyncapiScopeNote: |
    No AsyncAPI document was authored. iconik's public API surface is a set of
    versioned REST microservices (Assets, Collections, Metadata, Search, Files,
    Jobs, and more) accessed over HTTPS with request/response semantics. There
    is no documented WebSocket (ws:// or wss://) or Server-Sent Events transport
    on iconik's own API. iconik delivers change notifications as HTTP webhooks -
    iconik POSTs a JSON payload to a callback URL you register - which is a
    server-to-endpoint HTTP callback, not a bidirectional or server-push socket,
    so there is no server-push transport on iconik's own API to model.
findings:
  summary: |
    iconik does not publish a documented public WebSocket API. iconik is a
    hybrid cloud media asset management (MAM) platform. Its API is API-first and
    exposed as versioned REST microservices under
    https://app.iconik.io/API/{service}/v1/ (Assets, Collections and delete
    queue under /assets/, Metadata and Views under /metadata/, Search under
    /search/, Files/Formats/Storage under /files/, Jobs under /jobs/, plus
    Users, ACLs, Auth, Automations, ML, Notifications, Settings, Stats, and
    Transcode). Every request is authenticated with two headers, App-ID and
    Auth-Token, generated by an administrator in the web UI. All documented
    endpoints are request/response REST over HTTPS returning JSON. Event
    notifications are delivered via HTTP webhooks configured through the
    notifications microservice - iconik POSTs a JSON body to a callback URL when
    a subscribed event fires. No realtime, bidirectional, or streaming WebSocket
    (ws:// or wss://) endpoint is documented anywhere in iconik's API reference.
  openSource: |
    iconik is a proprietary, commercial SaaS product (part of the Backlight
    family). It is not open source. The API operates against your own iconik
    tenant and requires an account plus administrator-issued application
    credentials.
  transports:
    - protocol: REST
      scheme: https
      baseURL: https://app.iconik.io/API
      documented: true
      note: Versioned microservice REST APIs under /API/{service}/v1/. JSON request/response. Regional host such as https://eu.iconik.io/API also exists.
    - protocol: Webhook
      scheme: https
      documented: true
      note: Notifications microservice registers callback URLs; iconik POSTs a JSON event payload to the endpoint. Server-to-endpoint HTTP, not WebSocket.
    - protocol: WebSocket
      scheme: wss
      documented: false
      note: No WebSocket endpoint is documented anywhere in iconik's API reference as of the review date.
